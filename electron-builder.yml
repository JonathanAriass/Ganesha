appId: com.jonathanariass.dbclient
productName: Ganesha
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # Exclude the native LLM binaries (@node-llama-cpp/*: unsigned .dylib/.node/.so) from the app —
  # they are the macOS XProtect false-positive trigger that got the whole app deleted. They're
  # downloaded on demand into userData instead; the patched node-llama-cpp reads their location from
  # GANESHA_LLAMA_BINS_DIR (see patches/). node-llama-cpp's pure-JS package stays bundled.
  - "!**/node_modules/@node-llama-cpp/**"
# node-llama-cpp (JS + llama.cpp templates/grammars) lives outside the asar so its files resolve at
# runtime. Its native binaries are NOT bundled (see the files exclusion above).
asarUnpack:
  - "**/node_modules/node-llama-cpp/**"
  # The LLM engine runs via utilityProcess.fork — its entry must be a real file on disk (an
  # asar-packed script can't be reliably forked). Electron redirects the app.asar path to this
  # unpacked copy transparently.
  - "out/main/engine-worker.js"
# Ship the `ganesha` CLI launcher inside the bundle (→ Ganesha.app/Contents/Resources/ganesha).
# The Homebrew cask symlinks it onto the user's PATH with a `binary` stanza so `ganesha` opens
# the app from a terminal.
extraResources:
  - from: bin/ganesha
    to: ganesha
mac:
  # zip, not dmg: on the macos-15-intel runner electron-builder's dmg finalize step
  # (`hdiutil detach`) reliably fails with "Resource busy", and macos-13 (the old Intel
  # image) is retired. zip never mounts a disk image, so it can't hit that. Homebrew
  # installs a zipped .app exactly like a dmg, so the cask UX is unchanged.
  target: zip
  category: public.app-category.developer-tools
  # Names each build what the release + Homebrew cask expect: Ganesha-<version>-arm64.zip / -x64.zip
  artifactName: ${productName}-${version}-${arch}.zip
  # ── Sign + notarize (Developer ID) ──
  # Requires these repo Actions secrets (see release.yml env): CSC_LINK (base64 Developer ID .p12),
  # CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. When the secrets are
  # absent (e.g. a fork), electron-builder skips signing and produces an unsigned build.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
publish:
  provider: github
  owner: JonathanAriass
  repo: Ganesha
win:
  target: nsis
linux:
  target:
    - AppImage
    - deb
  category: Development
